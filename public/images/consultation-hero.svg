<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f33" />
      <stop offset="60%" stop-color="#124b5b" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4bd51" />
      <stop offset="100%" stop-color="#c59b27" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b1f33" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="400" rx="24" fill="url(#bgGrad)" />

  <!-- Background Abstract Orbs -->
  <circle cx="550" cy="50" r="120" fill="#e4bd51" opacity="0.12" filter="blur(20px)" />
  <circle cx="50" cy="350" r="100" fill="#2dd4bf" opacity="0.15" filter="blur(15px)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05">
    <path d="M 0,50 L 600,50 M 0,100 L 600,100 M 0,150 L 600,150 M 0,200 L 600,200 M 0,250 L 600,250 M 0,300 L 600,300 M 0,350 L 600,350" stroke="#ffffff" stroke-width="1" />
    <path d="M 50,0 L 50,400 M 100,0 L 100,400 M 150,0 L 150,400 M 200,0 L 200,400 M 250,0 L 250,400 M 300,0 L 300,400 M 350,0 L 350,400 M 400,0 L 400,400 M 450,0 L 450,400 M 500,0 L 500,400 M 550,0 L 550,400" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Central Illustration Group -->
  <g transform="translate(10, 0)">
    <!-- Connection Lines / Data Flow -->
    <path d="M 180,240 Q 290,160 400,240" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="6,4" opacity="0.5" />
    <path d="M 180,240 Q 290,200 400,240" fill="none" stroke="#e4bd51" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />

    <!-- Table/Desk Line -->
    <line x1="100" y1="310" x2="480" y2="310" stroke="#ffffff" stroke-width="3" opacity="0.2" stroke-linecap="round" />

    <!-- Left Figure (Consultant - Ghanaian Professional) -->
    <!-- Head & Hair -->
    <circle cx="180" cy="150" r="24" fill="#5c3826" />
    <path d="M 160,135 Q 180,120 200,135 Q 210,150 200,165 Q 180,175 160,165 Q 150,150 160,135" fill="#1a110b" />
    <!-- Glasses -->
    <rect x="170" y="146" width="22" height="8" rx="2" fill="none" stroke="#e4bd51" stroke-width="2" />
    <line x1="165" y1="150" x2="170" y2="150" stroke="#e4bd51" stroke-width="2" />
    <!-- Neck & Body -->
    <rect x="174" y="172" width="12" height="15" fill="#5c3826" />
    <path d="M 140,185 L 220,185 L 230,260 L 130,260 Z" fill="#0f766e" />
    <!-- Collar (Gold/Teal Kente touch) -->
    <path d="M 170,185 L 180,205 L 190,185 Z" fill="#e4bd51" />
    <!-- Hands / Laptop interaction -->
    <circle cx="215" cy="245" r="8" fill="#5c3826" />

    <!-- Right Figure (Client / Organisation Representative) -->
    <!-- Head & Hair -->
    <circle cx="400" cy="160" r="24" fill="#80533f" />
    <path d="M 380,142 Q 400,130 420,142 Q 430,155 420,170 C 410,178 390,178 380,170 Q 370,155 380,142" fill="#111111" />
    <!-- Neck & Body -->
    <rect x="394" y="182" width="12" height="12" fill="#80533f" />
    <path d="M 360,194 L 440,194 L 450,270 L 350,270 Z" fill="#1e293b" />
    <!-- Scarf/Traditional Touch -->
    <path d="M 360,194 Q 400,210 440,194 L 435,205 Q 400,220 365,205 Z" fill="#e4bd51" />
    <!-- Hands / Notebook interaction -->
    <circle cx="365" cy="250" r="8" fill="#80533f" />

    <!-- Desktop Laptop (Consultant's desk) -->
    <rect x="210" y="250" width="70" height="42" rx="4" fill="#e2e8f0" filter="url(#dropShadow)" />
    <rect x="215" y="255" width="60" height="32" rx="2" fill="#1e293b" />
    <!-- Code/Graph representation on screen -->
    <rect x="220" y="260" width="25" height="4" rx="1" fill="#2dd4bf" />
    <rect x="220" y="268" width="40" height="4" rx="1" fill="#e4bd51" />
    <circle cx="265" cy="275" r="6" fill="#2dd4bf" />
    <!-- Keyboard/Base -->
    <path d="M 200,292 L 290,292 L 295,296 L 195,296 Z" fill="#94a3b8" />

    <!-- Floating Security Elements (Center Top) -->
    <g transform="translate(290, 80)" filter="url(#softShadow)">
      <!-- Central Shield -->
      <path d="M 0,0 C 15,-10 35,-10 50,0 C 50,25 40,55 0,70 C -40,55 -50,25 -50,0 C -35,-10 -15,-10 0,0 Z" fill="url(#tealGrad)" />
      <!-- Inner Shield Stroke -->
      <path d="M 0,5 C 12,-4 28,-4 40,5 C 40,25 32,48 0,60 C -32,48 -40,25 -40,5 C -28,-4 -12,-4 0,5 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" />
      <!-- Gold Lock Icon -->
      <rect x="-12" y="10" width="24" height="18" rx="3" fill="url(#goldGrad)" />
      <path d="M -7,10 L -7,4 C -7,0 -3,-3 1,-3 C 5,-3 9,0 9,4 L 9,10" fill="none" stroke="#e4bd51" stroke-width="4.5" stroke-linecap="round" />
      <circle cx="0" cy="18" r="3" fill="#0b1f33" />
    </g>

    <!-- Small Documents / Assets -->
    <!-- Left Document -->
    <g transform="translate(110, 220) rotate(-5)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="40" height="52" rx="4" fill="#ffffff" />
      <line x1="6" y1="10" x2="34" y2="10" stroke="#0f766e" stroke-width="3" />
      <line x1="6" y1="18" x2="28" y2="18" stroke="#94a3b8" stroke-width="2" />
      <line x1="6" y1="26" x2="34" y2="26" stroke="#94a3b8" stroke-width="2" />
      <line x1="6" y1="34" x2="20" y2="34" stroke="#94a3b8" stroke-width="2" />
      <circle cx="30" cy="42" r="5" fill="#2dd4bf" />
    </g>

    <!-- Right Document / Checklists -->
    <g transform="translate(430, 210) rotate(8)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="45" height="58" rx="4" fill="#ffffff" />
      <line x1="8" y1="12" x2="37" y2="12" stroke="#0b1f33" stroke-width="3.5" />
      <!-- Checklist bullets -->
      <circle cx="10" cy="24" r="2.5" fill="#e4bd51" />
      <line x1="16" y1="24" x2="35" y2="24" stroke="#475569" stroke-width="2" />
      <circle cx="10" cy="34" r="2.5" fill="#2dd4bf" />
      <line x1="16" y1="34" x2="35" y2="34" stroke="#475569" stroke-width="2" />
      <circle cx="10" cy="44" r="2.5" fill="#2dd4bf" />
      <line x1="16" y1="44" x2="30" y2="44" stroke="#475569" stroke-width="2" />
    </g>
  </g>
</svg>
