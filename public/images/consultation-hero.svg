<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">A consultant reviews a privacy action plan</title>
  <desc id="desc">A Ghanaian data-protection professional reviews a practical privacy action plan with completed checks and a secure document.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#edf8f6"/><stop offset=".56" stop-color="#f8fafc"/><stop offset="1" stop-color="#fff8e9"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f5f8fa"/></linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16435b"/><stop offset="1" stop-color="#0b1f33"/></linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="15" stdDeviation="13" flood-color="#0b1f33" flood-opacity=".15"/></filter>
  </defs>

  <rect width="800" height="500" fill="url(#backdrop)"/>
  <circle cx="90" cy="55" r="150" fill="#ccfbf1" opacity=".47"/>
  <circle cx="738" cy="434" r="175" fill="#fef3c7" opacity=".56"/>
  <path d="M0 425c139-38 247 32 383-1 151-36 238-45 417 6v70H0Z" fill="#fff" opacity=".72"/>

  <!-- one clear, practical plan: no decorative dashboard -->
  <g transform="translate(80 102) rotate(-5 182 158)" filter="url(#shadow)">
    <rect width="362" height="315" rx="17" fill="url(#paper)" stroke="#d7e2e8" stroke-width="2"/>
    <rect x="30" y="30" width="48" height="9" rx="4.5" fill="#d4a72c"/>
    <text x="30" y="72" fill="#0b1f33" font-family="Arial, sans-serif" font-size="22" font-weight="700">Privacy action plan</text>
    <text x="30" y="96" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Simple steps. Stronger trust.</text>
    <line x1="30" y1="119" x2="332" y2="119" stroke="#dbe6ed" stroke-width="2"/>

    <circle cx="49" cy="151" r="13" fill="#d1fae5"/><path d="m42 151 5 5 10-11" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="76" y="141" width="140" height="8" rx="4" fill="#284557"/><rect x="76" y="158" width="89" height="5" rx="2.5" fill="#aabcc7"/>
    <circle cx="297" cy="152" r="11" fill="#d1fae5"/><path d="m292 152 4 4 7-8" fill="none" stroke="#047857" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="49" cy="202" r="13" fill="#d1fae5"/><path d="m42 202 5 5 10-11" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="76" y="192" width="169" height="8" rx="4" fill="#284557"/><rect x="76" y="209" width="106" height="5" rx="2.5" fill="#aabcc7"/>
    <circle cx="297" cy="203" r="11" fill="#d1fae5"/><path d="m292 203 4 4 7-8" fill="none" stroke="#047857" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="49" cy="253" r="13" fill="#fef3c7"/><path d="M49 246v8" stroke="#a16207" stroke-width="2.6" stroke-linecap="round"/><circle cx="49" cy="259" r="1.8" fill="#a16207"/>
    <rect x="76" y="243" width="125" height="8" rx="4" fill="#284557"/><rect x="76" y="260" width="97" height="5" rx="2.5" fill="#aabcc7"/>
    <circle cx="297" cy="254" r="11" fill="#fef3c7"/><path d="M297 248v7" stroke="#a16207" stroke-width="2.2" stroke-linecap="round"/><circle cx="297" cy="259" r="1.3" fill="#a16207"/>
  </g>

  <!-- protected document: intentionally small, supporting the plan rather than dominating it -->
  <g transform="translate(112 391)" filter="url(#shadow)">
    <rect width="156" height="60" rx="12" fill="#0f766e"/>
    <path d="M29 17c6-4 12-4 18 0v13c0 13-9 20-18 24-9-4-18-11-18-24V17c6-4 12-4 18 0Z" fill="#d1fae5"/>
    <path d="m22 31 5 5 10-12" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="63" y="30" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="700">Protected</text>
    <text x="63" y="45" fill="#bde9e2" font-family="Arial, sans-serif" font-size="9">confidential handling</text>
  </g>

  <!-- editorial professional, intentionally right-weighted -->
  <g transform="translate(490 63)">
    <!-- chair and grounded workspace -->
    <path d="M152 280v103M105 383h94" stroke="#516779" stroke-width="8" stroke-linecap="round"/>
    <path d="M95 198v117h103V198c0-50-103-50-103 0Z" fill="#d6e4e8"/>
    <path d="M108 205v102h75V205c0-37-75-37-75 0Z" fill="#eff5f5"/>
    <!-- torso / jacket -->
    <path d="M75 349c4-91 50-119 99-119 59 0 100 43 104 119Z" fill="url(#jacket)"/>
    <path d="m141 236 32 49 31-49" fill="#fff"/>
    <path d="m173 285 14 61-14 21-14-21z" fill="#d4a72c"/>
    <!-- restrained textile trim -->
    <path d="M90 323c31 12 51 12 78 0s58-12 92 0" fill="none" stroke="#d4a72c" stroke-width="5" stroke-linecap="round" opacity=".92"/>
    <path d="M110 335l10 9 10-9 10 9 10-9M208 335l10 9 10-9 10 9 10-9" fill="none" stroke="#6ee7d7" stroke-width="2" opacity=".8"/>
    <!-- neck / face -->
    <path d="M153 209h39v41c0 14-39 14-39 0Z" fill="#6e422e"/>
    <path d="M126 149c0-48 76-52 84-1v35c0 36-19 58-42 58s-42-22-42-58Z" fill="#744833"/>
    <!-- hair -->
    <path d="M122 165c-5-51 27-78 67-61 26 11 29 34 20 58-7-18-19-28-39-30-12-1-31 6-48 33Z" fill="#201615"/>
    <path d="M133 135c2-29 23-46 45-42 23 3 38 23 33 50-19-18-59-17-78-8Z" fill="#201615"/>
    <circle cx="151" cy="173" r="3" fill="#fff"/><circle cx="190" cy="173" r="3" fill="#fff"/>
    <path d="M157 205c8 6 18 6 26 0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
    <!-- hand holding plan -->
    <path d="M112 287c-42 10-92 32-135 47" fill="none" stroke="#744833" stroke-width="15" stroke-linecap="round"/>
    <path d="M215 288c20 13 33 29 43 47" fill="none" stroke="#744833" stroke-width="15" stroke-linecap="round"/>
    <circle cx="-23" cy="334" r="9" fill="#744833"/><circle cx="260" cy="339" r="9" fill="#744833"/>
  </g>
</svg>
