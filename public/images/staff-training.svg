<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071827" />
      <stop offset="60%" stop-color="#0b2c3d" />
      <stop offset="100%" stop-color="#0f5a60" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4bd51" />
      <stop offset="100%" stop-color="#b88d1d" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="400" rx="24" fill="url(#bgGrad)" />

  <!-- Abstract Orbs -->
  <circle cx="100" cy="80" r="130" fill="#2dd4bf" opacity="0.1" filter="blur(25px)" />
  <circle cx="500" cy="320" r="100" fill="#e4bd51" opacity="0.08" filter="blur(20px)" />

  <!-- Grid lines -->
  <g opacity="0.03">
    <path d="M 0,50 L 600,50 M 0,100 L 600,100 M 0,150 L 600,150 M 0,200 L 600,200 M 0,250 L 600,250 M 0,300 L 600,300 M 0,350 L 600,350" stroke="#ffffff" stroke-width="1" />
    <path d="M 50,0 L 50,400 M 100,0 L 100,400 M 150,0 L 150,400 M 200,0 L 200,400 M 250,0 L 250,400 M 300,0 L 300,400 M 350,0 L 350,400 M 400,0 L 400,400 M 450,0 L 450,400 M 500,0 L 500,400 M 550,0 L 550,400" stroke="#ffffff" stroke-width="1" />
  </g>

  <g transform="translate(10, 10)">
    <!-- Presenter Screen / Whiteboard -->
    <g transform="translate(140, 60)" filter="url(#dropShadow)">
      <!-- Board Border -->
      <rect x="0" y="0" width="300" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
      <!-- Content Inner -->
      <rect x="10" y="10" width="280" height="150" rx="6" fill="#0f172a" />
      <!-- Top Title -->
      <text x="30" y="40" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" letter-spacing="1">DATA PRIVACY PRINCIPLES</text>
      <!-- Sub headers / content -->
      <rect x="30" y="60" width="140" height="6" rx="3" fill="#334155" />
      <rect x="30" y="74" width="100" height="6" rx="3" fill="#334155" />

      <!-- Rule 1 -->
      <circle cx="36" cy="100" r="4" fill="#2dd4bf" />
      <rect x="48" y="97" width="120" height="5" rx="2" fill="#e2e8f0" />
      <!-- Rule 2 -->
      <circle cx="36" cy="118" r="4" fill="#e4bd51" />
      <rect x="48" y="115" width="100" height="5" rx="2" fill="#e2e8f0" />
      <!-- Rule 3 -->
      <circle cx="36" cy="136" r="4" fill="#38bdf8" />
      <rect x="48" y="133" width="115" height="5" rx="2" fill="#e2e8f0" />

      <!-- Slide Graphic (Shield in Lock) -->
      <g transform="translate(218, 98)">
        <path d="M 0,-30 C 10,-35 22,-35 30,-30 C 30,-15 24,5 0,15 C -24,5 -30,-15 -30,-30 C -22,-35 -10,-35 0,-30 Z" fill="url(#tealGrad)" opacity="0.8" />
        <path d="M 0,-15 C 5,-18 11,-18 15,-15 C 15,-5 12,5 0,10 C -12,5 -15,-5 -15,-15 C -11,-18 -5,-18 0,-15 Z" fill="none" stroke="#ffffff" stroke-width="2" />
        <circle cx="0" cy="-3" r="4" fill="#e4bd51" />
      </g>
    </g>

    <!-- Board Stand Legs -->
    <line x1="220" y1="230" x2="200" y2="290" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="360" y1="230" x2="380" y2="290" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

    <!-- Presenter (Ghanaian Lady Standing Left of Board) -->
    <g transform="translate(60, 110)">
      <!-- Head & Hair Updo -->
      <circle cx="35" cy="50" r="20" fill="#4d2f1f" />
      <!-- Hair bun -->
      <circle cx="35" cy="26" r="14" fill="#0c0704" />
      <!-- Dress / Body -->
      <rect x="30" y="68" width="10" height="12" fill="#4d2f1f" />
      <path d="M 12,80 L 58,80 L 66,170 L 4,170 Z" fill="#e4bd51" />
      <!-- Pattern stripes on clothing (African print feel) -->
      <path d="M 16,100 Q 35,115 54,100" fill="none" stroke="#0f766e" stroke-width="4" />
      <path d="M 12,125 Q 35,140 58,125" fill="none" stroke="#0f766e" stroke-width="4" />
      <path d="M 8,150 Q 35,165 62,150" fill="none" stroke="#0f766e" stroke-width="4" />
      <!-- Arm pointing to screen -->
      <path d="M 50,95 Q 85,85 105,70" fill="none" stroke="#4d2f1f" stroke-width="8" stroke-linecap="round" />
    </g>

    <!-- Audience Row (Foreground view from back-right) -->
    <!-- Audience 1 (Left) -->
    <g transform="translate(180, 250)">
      <!-- Head and neck -->
      <circle cx="40" cy="40" r="18" fill="#5c3826" />
      <!-- Shoulders -->
      <path d="M 10,58 C 10,58 15,58 20,58 C 25,58 35,55 40,55 C 45,55 55,58 60,58 C 65,58 70,58 70,58 L 76,120 L 4,120 Z" fill="#1e293b" />
    </g>

    <!-- Audience 2 (Middle) -->
    <g transform="translate(280, 240)">
      <!-- Head and neck -->
      <circle cx="40" cy="40" r="20" fill="#784934" />
      <path d="M 24,25 Q 40,15 56,25 Q 64,40 56,55 Q 40,60 24,55 Q 16,40 24,25" fill="#111111" />
      <!-- Shoulders -->
      <path d="M 5,60 C 15,55 25,55 40,55 C 55,55 65,55 75,60 L 82,130 L -2,130 Z" fill="#0f766e" opacity="0.9" />
    </g>

    <!-- Audience 3 (Right) -->
    <g transform="translate(380, 255)">
      <!-- Head and neck -->
      <circle cx="40" cy="40" r="18" fill="#4d2f1f" />
      <!-- Shoulders -->
      <path d="M 12,58 C 12,58 15,58 20,58 C 25,58 35,55 40,55 C 45,55 55,58 60,58 C 65,58 68,58 68,58 L 74,115 L 6,115 Z" fill="#334155" />
    </g>

    <!-- Floating Concept Nodes (Idea of knowledge transfer) -->
    <g opacity="0.75" transform="translate(10, -20)">
      <line x1="120" y1="180" x2="200" y2="130" stroke="#e4bd51" stroke-width="1.5" stroke-dasharray="4,4" />
      <line x1="430" y1="130" x2="480" y2="210" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4,4" />
      <circle cx="120" cy="180" r="6" fill="#e4bd51" />
      <circle cx="200" cy="130" r="4" fill="#2dd4bf" />
      <circle cx="430" cy="130" r="5" fill="#2dd4bf" />
      <circle cx="480" cy="210" r="6" fill="#e4bd51" />
    </g>
  </g>
</svg>
